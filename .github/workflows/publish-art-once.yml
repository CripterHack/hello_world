name: Publish synthetic 1995 art once
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-art-once.yml']
permissions: {}
concurrency:
  group: publish-historical-art
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CripterHack/hello_world' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0
      - name: Validate deterministic design and history behavior
        run: python3 -m unittest -v test_generate.py
      - name: Generate and verify 99 synthetic commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9f09e36acf4a5755b515510c0267e3bb666c401d"
          git config user.name "$(git log -1 --format=%an HEAD^)"
          git config user.email "$(git log -1 --format=%ae HEAD^)"
          BASE=$(git rev-parse HEAD)
          export BASE
          python3 generate.py --append-history "$PWD"
          python3 - <<'PY'
          import json, os, subprocess, datetime
          expected=json.load(open('dates.json'))['entries']
          actual=subprocess.check_output(['git','log','--reverse','--format=%aI|%cI',os.environ['BASE']+'..HEAD'],text=True).strip().splitlines()
          assert len(actual)==len(expected)==99
          for line, entry in zip(actual,expected):
              author,committer=line.split('|')
              target=datetime.datetime.fromisoformat(entry['timestamp'])
              assert datetime.datetime.fromisoformat(author.replace('Z','+00:00'))==target
              assert datetime.datetime.fromisoformat(committer.replace('Z','+00:00'))==target
          PY
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD
          git push origin HEAD:refs/heads/master
